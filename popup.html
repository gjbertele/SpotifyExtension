<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Extension</title>
    <script src="popupMessaging.js"></script>
    <script src="popup.js"></script>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="songSkipMenu">
        <div class="songList"></div>
        <input class="input titleInput" type="text" placeholder="Song Title">
        <input class="input artistInput" type="text" placeholder="Artist (Optional)">
        <input class="input timeInput" type="text" placeholder="Time">
        <div class="submit">
            <svg class="plus">
            <path d="M15.25 8a.75.75 0 0 1-.75.75H8.75v5.75a.75.75 0 0 1-1.5 0V8.75H1.5a.75.75 0 0 1 0-1.5h5.75V1.5a.75.75 0 0 1 1.5 0v5.75h5.75a.75.75 0 0 1 .75.75"></path>
            </svg>
        </div>
    </div>
    <div class="songManagerMenu">
        <div class='row row1'>
            <input class="input bassInput" type="range" value="0" min="-10" max="10">
            <span class="bassText">Bass (+0db)</span>
        </div>
        <div class='sidebar'><canvas class="sidebarDisplay"></canvas></div>
    </div>
</body>
</html>
